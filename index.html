<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#283139">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Base Shop">
<meta name="application-name" content="Base Shop">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>Base Shop Builder</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--fc:"Barlow Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",sans-serif;--fn:"DIN Alternate","Barlow",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--card:#232b31;--card2:#2b343b;--line:rgba(255,255,255,.07);--blue:#0093E7;--green:#16EC06;--yel:#FFDE00;--red:#FF0026;--mut:#9aa5ad}
html{background:#101518}
html,body{overflow-x:hidden;overflow-x:clip}
body{background:transparent;color:#f2f4f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;min-height:100dvh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,#283139 0%,#1c2328 38%,#121719 75%,#101518 100%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 96px)}
.page{display:none}.page.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.goal{font-family:var(--fc);font-weight:700;font-size:21px;letter-spacing:1.4px;text-transform:uppercase;color:#fff;line-height:1.15}
.goal b{color:var(--green)}
.cd{display:flex;align-items:center;gap:14px;margin-top:10px}
.cdn{font-family:var(--fn);font-size:40px;font-weight:700;line-height:1}
.cdl{font-family:var(--fc);letter-spacing:1.3px;text-transform:uppercase;color:#aab4bb;font-size:14px}
.gl{font-size:14.5px;color:#dfe5e8;margin-top:6px}
.gl span{font-family:var(--fc);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#aab4bb;margin-right:4px}
.slbl{font-family:var(--fc);font-size:15px;font-weight:700;letter-spacing:1.4px;color:#cfd6db;text-transform:uppercase;margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slbl small{color:#7f8a92;font-size:13px;letter-spacing:.8px}
/* rings (same drawing as the fitness app) */
.ring{position:relative;flex:0 0 auto}
.ring svg{display:block;width:100%;height:100%}
.rin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.rin b{font-family:var(--fn);font-weight:700;font-size:24px;color:#fff;letter-spacing:-.3px;line-height:1}
.rin b small{font-size:.55em;font-weight:700;margin-left:1px;color:#e6eaec}
.rings{display:flex;justify-content:space-between;gap:4px;margin:6px -4px 0}
.rbox{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0;padding:2px 0}
.rl{font-family:var(--fc);font-weight:700;font-size:14px;letter-spacing:1.4px;color:#fff;margin-top:6px;text-transform:uppercase;text-align:center}
.rs{font-size:12px;color:#a3adb4;font-weight:600;margin-top:1px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 4px}
.grid .rin b{font-size:16px}
.grid .rl{font-size:12.5px;letter-spacing:.8px;line-height:1.1}
/* date pill nav */
.dnav{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 4px}
.pnav{display:flex;align-items:center;background:#2b343b;border-radius:999px;height:40px;padding:0 2px}
.pnav .pa{width:38px;height:40px;background:none;border:0;font-size:24px;line-height:1;color:#fff;font-weight:600}
.pnav .pa:disabled{color:#4a555e}
.pl{position:relative;display:flex;align-items:center;justify-content:center;min-width:128px;padding:0 8px;height:30px;border-radius:999px;background:#3a444c;font-family:var(--fc);font-weight:700;font-size:15px;letter-spacing:1.6px;color:#fff;white-space:nowrap}
.pl input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;margin:0;font-size:16px}
.tbtn{background:#3a444c;border:0;border-radius:999px;color:#fff;font-family:var(--fc);letter-spacing:1px;text-transform:uppercase;font-size:13px;padding:6px 12px}
/* meeting rows */
.mrow{display:grid;grid-template-columns:1fr 70px 82px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-of-type{border-top:0}
.mhd{display:grid;grid-template-columns:1fr 70px 82px;gap:8px;font-family:var(--fc);font-size:12.5px;letter-spacing:1.2px;color:#7f8a92;text-transform:uppercase;padding-bottom:4px}
.mhd div:not(:first-child){text-align:center}
.mn{font-weight:700;font-size:15px;line-height:1.2}
.mt{font-size:12px;color:#a3adb4;margin-top:2px}
.num{width:100%;height:44px;border-radius:12px;border:1px solid #3a444c;background:#151b1f;text-align:center;font-family:var(--fn);font-size:20px;font-weight:700;color:#fff;-moz-appearance:textfield}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num.res{font-size:16px;color:#16EC06}
.num::placeholder{color:#4f5b63;font-size:13px;font-weight:600}
.num:focus{outline:none;border-color:#0093E7}
.seg{display:inline-flex;background:#151b1f;border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:8px;font-family:var(--fc);font-size:14px;letter-spacing:.8px;color:#cfd6db;padding:6px 10px;text-transform:uppercase}
.seg button.on{background:#3a444c;color:#fff}
/* lists */
.lst .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.lst .it:first-child{border-top:0}
.it .nm{font-weight:700}
.it .sub{font-size:13px;color:#a3adb4;margin-top:2px}
.pill{display:inline-block;background:#323b42;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;color:#cfd6db;white-space:nowrap}
.pill.g{background:rgba(22,236,6,.14);color:#16EC06}.pill.b{background:rgba(0,147,231,.18);color:#6cc3f5}.pill.y{background:rgba(255,222,0,.14);color:#FFDE00}
.dh{font-family:var(--fc);font-size:14px;letter-spacing:1.3px;color:#aab4bb;text-transform:uppercase;margin:14px 2px 2px}
.empty{color:#a3adb4;text-align:center;padding:22px 8px}
.stat{display:flex;justify-content:space-around;text-align:center}
.stat b{display:block;font-family:var(--fn);font-size:28px}
.stat span{font-family:var(--fc);letter-spacing:1.2px;text-transform:uppercase;color:#aab4bb;font-size:13px}
/* MD cards */
.md{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.md input,.md select,.md textarea{width:100%;background:#151b1f;border:1px solid #3a444c;border-radius:10px;padding:9px 10px;font-size:16px;color:#fff}
.md textarea{min-height:56px;resize:vertical}
.md label{display:block;font-family:var(--fc);font-size:12.5px;letter-spacing:1.2px;color:#7f8a92;text-transform:uppercase;margin:8px 2px 3px}
.md .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.md .nmi{font-weight:800;font-size:17px}
.btn{background:#0093E7;border:0;border-radius:12px;color:#fff;font-weight:700;padding:11px 14px;width:100%;font-size:15px}
.btn.ghost{background:#2b343b}
.del{background:none;border:0;color:#ff6b7f;font-size:13px;font-weight:700;margin-top:8px}
.foot{text-align:center;color:#6f7a82;font-size:12px;margin:22px 0 4px}
.foot button{background:#2b343b;border:0;border-radius:999px;color:#cfd6db;font-size:12px;padding:5px 12px;margin-left:6px}
/* trends (same look as the fitness app's trend view) */
.drow{display:flex;align-items:center;gap:12px;width:100%;background:#2f383f;border:0;border-radius:14px;padding:12px 14px;margin-top:8px;min-height:64px;text-align:left;color:#fff}
.drow:active{background:#3a444c}
.drow .di{font-size:20px;width:26px;text-align:center;flex:0 0 26px}
.drow .dn{flex:1;min-width:0;font-size:13px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#e6e6e6}
.drow .dn small{display:block;font-size:11px;color:#8c979f;letter-spacing:.3px;font-weight:600;text-transform:none;margin-top:2px}
.drow .dr{text-align:right;flex:0 0 auto}
.drow .dv{font-size:22px;font-weight:800;color:#fff;line-height:1.1;white-space:nowrap}
.drow .dv small{font-size:13px;color:#bbb;font-weight:700}
.drow .dp{font-size:12px;color:#8c979f;font-weight:600;margin-top:2px;white-space:nowrap}
.dgrp{font-family:var(--fc);font-size:14px;font-weight:700;letter-spacing:1.4px;color:#aab4bb;text-transform:uppercase;margin:18px 2px 2px}
.tvh{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.tvh button{width:44px;height:44px;background:none;border:0;font-size:34px;line-height:1;color:#fff;text-align:left}
.tvh span{font-family:var(--fc);font-size:17px;font-weight:700;letter-spacing:2px}
.tvh i{width:44px}
.tvsel{position:relative;display:flex;align-items:center;gap:12px;background:#2f383f;border-radius:14px;padding:16px;font-size:15px;letter-spacing:1px;text-transform:uppercase}
.tvsel b{flex:1}.tvsel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;font-size:16px}
.tvtop{display:flex;justify-content:space-between;gap:10px;margin-top:18px;align-items:flex-start}
.tvtop>div:first-child{min-width:0;flex:1 1 auto}
.tvl{font-family:var(--fc);font-size:13px;color:#9aa5ad;font-weight:700;letter-spacing:1.3px}
.tvavg{font-family:var(--fn);font-size:34px;font-weight:700;line-height:1.15}
.tvavg small{font-size:17px;color:#e6eaec;font-weight:700;margin-left:6px}
.tvpill{display:inline-block;margin-top:6px;background:#323b42;border-radius:4px;padding:3px 8px;font-size:12.5px;color:#cfd6db;font-weight:700}
.tvpill.g{background:rgba(22,236,6,.14);color:#16EC06}.tvpill.b{background:rgba(245,166,35,.16);color:#F5A623}
.tvctl{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:0 0 auto}
.tvnav{display:flex;align-items:center;gap:6px;font-family:var(--fc);font-size:15px;font-weight:700;letter-spacing:1.2px;white-space:nowrap}
.tvnav button{background:none;border:0;font-size:26px;line-height:1;width:30px;height:32px;color:#fff}
.tvnav button:disabled{color:#4a555e}
.tvins{font-size:16px;line-height:1.45;margin:16px 0 10px;color:#f2f4f5}
.tvc{width:100%;height:auto;display:block}
.tvfoot{font-size:12px;color:#8c979f;margin-top:8px}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(22,28,32,.82);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-top:1px solid rgba(255,255,255,.06);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs button{flex:1;min-width:0;background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#7f8a92;font-size:11.5px;font-weight:600;min-height:58px}
.tabs button .ic{width:25px;height:25px}
.tabs button.on{color:#fff}
@media (min-width:700px){.wrap{max-width:640px}}
/* ===== v4 polish: premium, mobile first ===== */
:root{--gold:#F5C451;--gold2:#D9A021}
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--card);border-radius:20px;padding:16px;box-shadow:0 10px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04)}
#hdr{position:relative;overflow:hidden;text-align:center;padding:22px 16px 18px;border:1px solid rgba(245,196,81,.22);background:radial-gradient(120% 90% at 50% -10%,rgba(245,196,81,.16),rgba(245,196,81,0) 60%),linear-gradient(180deg,#2a333a,#1d2429)}
.goal{font-family:var(--fc);text-transform:uppercase;line-height:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.goal .ge{font-size:14px;font-weight:700;letter-spacing:5px;color:#aab4bb}
.goal b{font-size:clamp(40px,12.5vw,58px);font-weight:800;letter-spacing:1px;color:var(--gold);background:linear-gradient(180deg,#FFE7A3 0%,#F5C451 45%,#C98E12 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 10px rgba(245,196,81,.25))}
.goal .gd{font-size:20px;font-weight:800;letter-spacing:2.4px;color:#fff}
.cd{justify-content:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cdl{text-align:left}
.gls{display:grid;gap:8px;margin-top:14px}
.gl{margin:0;text-align:center;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;padding:10px 10px 11px;font-size:18px;font-weight:700;color:#fff;line-height:1.3}
.gl span{display:block;font-size:13px;letter-spacing:2.2px;margin:0 0 3px;color:var(--gold)}
.gl small{font-weight:600}
.gl .sep{color:#5d6973;margin:0 6px;font-style:normal}
.gl em{font-style:normal;white-space:nowrap}
.slbl{font-size:15.5px;letter-spacing:1.8px;margin:22px 4px 8px}
.rl{letter-spacing:1.8px}
.rs{font-size:12.5px;color:#c3ccd2}
.dnav{margin:18px 0 6px}
.pnav{background:#2b343b;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.pl{background:#3d4850}
.num{border-radius:14px;background:#12171a}
.num:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,196,81,.15)}
.tabs button.on{color:var(--gold)}
.dsum{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dbig b{display:block;font-family:var(--fn);font-size:56px;font-weight:700;line-height:1;color:#fff}
.dbig span{font-family:var(--fc);font-size:14px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#aab4bb}
.dsm{display:flex;gap:8px}
.dsm div{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;text-align:center;min-width:76px}
.dsm b{display:block;font-family:var(--fn);font-size:22px;line-height:1.1}
.dsm span{font-family:var(--fc);font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:#aab4bb}
.dsm b small{font-size:13px;color:#8c979f;margin-left:2px}
.who .it{align-items:center}
.who .av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3a444c,#2b343b);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--gold);flex:0 0 38px;margin-right:10px}
.who .l{display:flex;align-items:center;min-width:0}
.mdt{width:100%;border-collapse:collapse}
.mdt th{font-family:var(--fc);font-size:12.5px;letter-spacing:1.3px;text-transform:uppercase;color:#8c979f;text-align:right;padding:0 4px 8px;font-weight:700}
.mdt th:first-child,.mdt td:first-child{text-align:left}
.mdt td{padding:13px 4px;border-top:1px solid var(--line);text-align:right;font-family:var(--fn);font-size:18px;font-weight:700;white-space:nowrap}
.mdt td:first-child{font-family:inherit;font-size:15.5px;white-space:normal}
.mdt td.na{color:#5d6973}
.legs{display:flex;align-items:center;gap:12px;padding:12px 14px}
.note{font-size:12.5px;color:#7f8a92;text-align:center;margin:6px 4px 0}
/* ===== v5 compact: every tab fits one screen (phone ~390x844, laptop 1280x800) ===== */
.wrap{padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 70px)}
.card{padding:12px;margin:8px 0;border-radius:18px}
.slbl{margin:10px 4px 5px;font-size:13.5px}
.slbl small{font-size:12px}
#hdr{padding:12px 12px 10px}
.goal{gap:2px}
.goal .ge{font-size:10.5px;letter-spacing:4px}
.goal b{font-size:clamp(34px,10.5vw,44px)}
.goal .gd{font-size:15px;letter-spacing:2px}
.cd{margin-top:8px;padding-top:8px;gap:10px}
.cdn{font-size:30px}
.cdl{font-size:12px;line-height:1.25}
.gls{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.gl{padding:6px 4px 7px;font-size:14px;border-radius:12px;line-height:1.2}
.gl span{font-size:10.5px;letter-spacing:1.6px;margin-bottom:2px}
.gl em{display:block}
.gl small{font-size:10.5px!important}
.dnav{margin:8px 0 2px}
.pnav{height:36px}.pnav .pa{height:36px}.pl{height:28px}
.tbtn{padding:5px 10px}
/* results rings: 2 rows (recruits, points) x 3 cols (day, week, month) */
.rg{display:grid;grid-template-columns:58px repeat(3,1fr);align-items:center;row-gap:6px;column-gap:4px}
.rg .rh{font-family:var(--fc);font-size:11.5px;font-weight:700;letter-spacing:1.4px;color:#aab4bb;text-transform:uppercase;text-align:center}
.rg .rn{font-family:var(--fc);font-size:12.5px;font-weight:800;letter-spacing:1.2px;color:var(--gold);text-transform:uppercase;line-height:1.1}
.rg .rn small{display:block;color:#7f8a92;font-size:10.5px;letter-spacing:.8px}
.rc{display:flex;align-items:center;justify-content:center;gap:7px;min-width:0}
.rc .rin b{font-size:13.5px}
.rc .rt{font-size:11.5px;color:#c3ccd2;font-weight:700;line-height:1.15;white-space:nowrap}
.rc .rt small{display:block;color:#7f8a92;font-weight:600;font-size:10.5px}
/* meeting rows */
.mrow,.mhd{grid-template-columns:1fr 62px 78px;gap:6px}
.mrow{padding:4px 0}
.mhd{padding-bottom:2px;font-size:11px}
.mn{font-size:14px}
.mt{font-size:11px;margin-top:1px}
.num{height:38px;font-size:18px;border-radius:12px}
.num.res{font-size:15px}
/* certs / licences */
.dbig b{font-size:42px}
.dbig span{font-size:12.5px}
.dsm div{padding:6px 8px;min-width:64px}
.dsm b{font-size:19px}
.lst .it{padding:7px 0}
.who .av{width:32px;height:32px;flex-basis:32px;font-size:12.5px}
.note{margin-top:4px;font-size:11.5px}
.empty{padding:12px 6px}
/* MDs */
.mdt td{padding:9px 4px;font-size:16px}
.mdt td:first-child{font-size:14.5px}
.legs{padding:8px 12px}
/* trends dashboard: compact tile grid */
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.dgrp{margin:8px 2px 4px;font-size:12px}
.dt{display:flex;flex-direction:column;justify-content:space-between;gap:2px;background:#2b343b;border:1px solid var(--line);border-radius:12px;padding:7px 9px;min-height:52px;text-align:left;color:#fff}
.dt:active{background:#3a444c}
.dt .tn{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#cfd6db;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt .tv{display:flex;align-items:baseline;justify-content:space-between;gap:4px}
.dt .tv b{font-family:var(--fn);font-size:19px;line-height:1}
.dt .tv b small{font-size:11.5px;color:#9aa5ad;margin-left:2px}
.dt .tv i{font-style:normal;font-size:10.5px;color:#8c979f;font-weight:600;white-space:nowrap}
.foot{margin:8px 0 0;font-size:11px}
.foot button{font-size:11px;padding:3px 10px}
.tabs button{min-height:52px;padding:6px 0 7px;gap:2px}
.tabs button .ic{width:23px;height:23px}
.tvc{max-height:44vh}
/* laptop: wider, meetings side by side */
.mrow{padding:3px 0}.num{height:35px}
.slbl{margin:7px 4px 4px}
.card{margin:6px 0}
.rg{row-gap:4px}
.dgrp{margin:6px 2px 3px}
.dt{min-height:46px;padding:6px 9px}.tgrid{gap:5px}
@media (min-width:900px){
  .wrap{max-width:980px;padding-bottom:76px;zoom:1.12}
  .tvc{max-height:38vh}
  .tvins{margin:8px 0 6px}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .tgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  #p-cert,#p-lic,#p-md,#p-tview{max-width:640px;margin:0 auto}
  .goal{flex-direction:row;justify-content:center;align-items:baseline;gap:14px}
  .gls{max-width:760px;margin-left:auto;margin-right:auto}
}
/* ===== v6: base / super base split panels ===== */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pan{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)),var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.pan.base{border-color:rgba(245,196,81,.28)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:4px}
.ph b{font-family:var(--fc);font-size:13px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold)}
.pan.sb .ph b{color:#6cc3f5}
.ph small{display:block;font-family:var(--fc);font-size:10.5px;letter-spacing:.8px;color:#7f8a92;text-transform:uppercase}
.ph .pc{font-family:var(--fn);font-size:24px;font-weight:700;line-height:1}
.nl{font-size:13.5px;font-weight:700;padding:6px 0;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nl small{display:block;font-size:11px;color:#8c979f;font-weight:600}
.nl:first-of-type{border-top:0}
.pan .empty{padding:8px 2px;font-size:12.5px;text-align:left}
.mds{display:grid;gap:8px}
.mdt .ttl{display:inline-block;margin-left:5px;font-size:10.5px;font-weight:800;color:#101518;background:var(--gold);border-radius:4px;padding:0 4px;vertical-align:2px}
.pan.sb .mdt .ttl{background:#6cc3f5}
.pan .mdt th{padding:0 3px 5px;font-size:11px}
.pan .mdt td{padding:7px 3px;font-size:15px}
.pan .mdt td:first-child{font-size:13.5px}
.tgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.segc{display:flex;justify-content:center;margin:6px 0 2px}
@media (min-width:900px){
  #p-lic,#p-md{max-width:none}
  .mds{grid-template-columns:1fr 1fr}
  .licw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:start}
}
/* ===== v7: base shop tags, licensed roster ===== */
.bst{display:inline-block;font-family:var(--fc);font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:#101518;background:linear-gradient(180deg,#FFE7A3,#F5C451 55%,#D9A021);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.slbl .bst{font-size:10.5px}
.nls{font-size:12.5px;font-weight:700;line-height:1.35;max-height:3.1em;overflow:auto;color:#e6eaec}
.nls.e{color:#7f8a92;font-weight:600}
.pan.cmp{padding:7px 9px}.pan.cmp .ph{margin-bottom:2px}.pan.cmp .pc{font-size:19px}
.roster{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.roster .pan.off{display:none}
.rt2{width:100%;border-collapse:collapse;table-layout:fixed}
.rt2 th{font-family:var(--fc);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:#8c979f;text-align:right;padding:0 3px 4px;font-weight:700}
.rt2 td{padding:5px 3px;border-top:1px solid var(--line);text-align:right;font-family:var(--fn);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt2 th:first-child,.rt2 td:first-child{text-align:left;font-family:inherit}
.rt2 td:first-child{font-size:13px}
.rt2 td.cd2{color:#9aa5ad;font-size:12px;font-weight:600}
.rt2 col.c1{width:auto}.rt2 col.c2{width:62px}.rt2 col.c3{width:74px}.rt2 col.c4{width:82px}
.rb{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line)}
.rb .rt2 tr:first-child td{border-top:0}
.rtot td{border-top:1px solid rgba(245,196,81,.35)!important;color:var(--gold)}
.pan.sb .rtot td{color:#6cc3f5;border-top-color:rgba(108,195,245,.35)!important}
.wait{color:#7f8a92;text-align:center;padding:16px 6px;font-size:13px}
#rSeg{margin-left:auto}
.nrc{padding:6px 10px}
.nper{font-family:var(--fc);font-size:10.5px;letter-spacing:1px;color:#7f8a92;text-transform:uppercase;margin-bottom:2px}
.nrw{display:flex;align-items:baseline;gap:7px;padding:2px 0;min-width:0}
.nrw b{font-family:var(--fc);font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.nrw.sb b{color:#6cc3f5}
.nrw .pc{font-size:14px;min-width:12px}
.nrw .nls{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:none;font-size:12.5px}
#roster .pan{padding:6px 9px}
.rt2 th .tl{font-size:13px;letter-spacing:1.2px;color:var(--gold);margin-right:6px}.pan.sb .rt2 th .tl{color:#6cc3f5}
.rt2 th .pc{font-size:15px;color:#fff;letter-spacing:0}
.rt2 thead th{vertical-align:bottom}
#p-lic .rg{row-gap:2px}#p-lic .rg .rt{font-size:11px}
#rSeg button{font-size:12px;padding:4px 8px;white-space:nowrap}
#rMeta{white-space:nowrap;font-size:11px}
#p-lic .slbl>span{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (min-width:900px){
  .roster{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .roster .pan.off{display:block}
  #rSeg{display:none}
}
</style>

<body>
<div class="wrap">
  <div class="card" id="hdr">
    <div class="goal"><span class="ge">GOAL</span><b>EMD + $250K</b><span class="gd">by June 30, 2027</span></div>
    <div class="cd"><div class="cdn" id="daysLeft">-</div><div class="cdl">days left<br><span id="todayLbl"></span></div></div>
    <div class="gls"><div class="gl" id="monthGoal"></div><div class="gl" id="weekGoal"></div><div class="gl" id="dayGoal"></div></div>
  </div>

  <!-- TAB 1: MEETINGS -->
  <section class="page" id="p-meet">
    <div class="dnav"><div class="pnav"><button class="pa" id="dPrev" aria-label="Previous day">‹</button><div class="pl"><span id="dLbl">TODAY</span><input type="date" id="dPick" aria-label="Pick a date"></div><button class="pa" id="dNext" aria-label="Next day">›</button></div><button class="tbtn" id="dToday" hidden>Today</button></div>
    <div class="mgrid">
      <div><div class="slbl"><span>Results vs goal<span class="bst">BASE SHOP</span></span><small id="logFor"></small></div>
      <div class="card"><div class="rg" id="resGrid"></div></div></div>
      <div><div class="slbl"><span>Log meetings &amp; results<span class="bst">BASE SHOP</span></span></div>
      <div class="card" id="mRows"></div></div>
    </div>
  </section>

  <!-- TAB 2: CERTIFICATIONS (day by day, filled by the bot) -->
  <section class="page" id="p-cert">
    <div class="dnav"><div class="pnav"><button class="pa" id="cPrev" aria-label="Previous day">‹</button><div class="pl"><span id="cLbl">TODAY</span><input type="date" id="cPick" aria-label="Pick a date"></div><button class="pa" id="cNext" aria-label="Next day">›</button></div><button class="tbtn" id="cToday" hidden>Today</button></div>
    <div class="card dsum"><div class="dbig"><b id="cCnt">0</b><span id="cCntL">certifications</span></div><div class="dsm" id="cWM"></div></div>
    <div class="slbl"><span>Who cleared<span class="bst">BASE SHOP</span></span><small id="cFor"></small></div>
    <div class="card lst who" id="certList"></div>
    <div class="note">Base shop only (your own base). Updated by your bot</div>
  </section>

  <!-- TAB 3: LICENCES (day by day, filled by the bot) -->
  <section class="page" id="p-lic">
    <div class="dnav"><div class="pnav"><button class="pa" id="lPrev" aria-label="Previous day">‹</button><div class="pl"><span id="lLbl">TODAY</span><input type="date" id="lPick" aria-label="Pick a date"></div><button class="pa" id="lNext" aria-label="Next day">›</button></div><button class="tbtn" id="lToday" hidden>Today</button></div>
    <div class="licw">
      <div><div class="slbl">New licences <small>base goal 1/wk · 3/mo</small></div>
      <div class="card" style="padding:9px 10px"><div class="rg" id="licGrid"></div></div></div>
      <div><div class="slbl"><span>New names <small id="nPer"></small></span><div class="seg" id="lSeg"><button data-r="D">Day</button><button data-r="W">Week</button><button data-r="M">Month</button></div></div>
      <div class="card nrc" id="licSplit"></div></div>
    </div>
    <div class="slbl"><span>All licensed agents <small id="rMeta"></small></span><div class="seg" id="rSeg"><button data-r="base">Base</button><button data-r="superbase">Super base</button></div></div>
    <div class="roster" id="roster"></div>
  </section>

  <!-- TAB 4: MDs (bs-v1:mdstats, filled by the bot from MyWFG) -->
  <section class="page" id="p-md">
    <div class="slbl">MD teams <small id="mdMeta"></small></div>
    <div class="mds" id="mdSplit"></div>
    <div class="note" id="mdUpd"></div>
    <div class="card legs"><div id="legRing"></div><div><div class="mn" id="legTxt"></div><div class="mt" id="legNames"></div></div></div>
  </section>

  <!-- TAB 5: TRENDS -->
  <section class="page" id="p-trends">
    <div id="tDash"></div>
  </section>
  <section class="page" id="p-tview">
    <div class="tvh"><button id="tvBack" aria-label="Back">‹</button><span>TREND VIEW</span><i></i></div>
    <label class="tvsel"><span id="tvSelIc"></span><b id="tvSelName"></b><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 9l7 7 7-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><select id="tvSel" aria-label="Metric"></select></label>
    <div class="tvtop">
      <div><div class="tvl" id="tvLbl">TOTAL</div><div class="tvavg" id="tvTot"></div><div id="tvPill"></div></div>
      <div class="tvctl"><div class="seg" id="tvSeg"><button data-r="W">Week</button><button data-r="M">Month</button><button data-r="A">All</button></div>
        <div class="tvnav"><button id="tvPrev" aria-label="Earlier">‹</button><span id="tvRange"></span><button id="tvNext" aria-label="Later">›</button></div></div>
    </div>
    <p class="tvins" id="tvIns"></p>
    <div id="tvChart"></div>
    <div class="tvfoot" id="tvFoot"></div>
  </section>

  <div class="foot"><span id="appVer"></span><button id="syNow">Sync now</button></div>
</div>

  <button data-t="meet"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Meetings</button>

  <button data-t="lic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16c.5-1.5 1.6-2.3 3-2.3s2.5.8 3 2.3M14 10h4M14 13.5h4"/></svg>Licences</button>
  <button data-t="md"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.4 6.8 19.2l1-5.9L3.5 9.2l5.9-.8z"/></svg>MDs</button>
  <button data-t="trends"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 5-7 4 5M3 21h18"/></svg>Trends</button>

<script>
// ==== APP VERSION: on EVERY deploy bump APP_VERSION here AND "v" in version.json to the same new value. ====
// The app compares them on open / when it comes back to the foreground and reloads itself once if they differ (fixes stale phone Home Screen copies).
var APP_VERSION="2026.11.02-7";
// ==== CLOUD SYNC: every device syncs all bs-v1:* keys with one public no-auth JSON bin (npoint.io). No tokens/keys anywhere. ====
// Prefix bs-v1: (NOT nn-v1:) because this app shares the harpreetsbajwa92.github.io origin (and so localStorage) with the fitness app.
var SYNC_CONFIG={url:"https://api.npoint.io/5b132b3a6768f39258a9"};
(function(){
  var PREFIX="bs-v1:", TZ="America/Toronto";
  var GOAL_DATE="2027-06-30";
  var CATS=[
    {id:"pr",n:"Personal recruiting",res:"recruits"},
    {id:"pc",n:"Personal closing",res:"points"},
    {id:"br",n:"Base recruiting",res:"recruits"},
    {id:"bp",n:"Base closing",res:"points"}      // was "Base production"; same data key bp
  ];
  // weekly meeting targets by phase (Mon–Sat weeks)
  var WK={nov:{pr:3,pc:5,br:3,bp:4},dec:{pr:4,pc:5,br:5,bp:6},full:{pr:4,pc:5,br:6,bp:8}};
  var MO_FULL={pr:17,pc:22,br:26,bp:34};
  var CONTACTS={d:3,w:18,m:75};
  // headline results: $100K business = 15 base recruits + 100,000 base points a month
  // week = ceil(15/4.33)=4 and round(100000/4.33)=23K; day (Mon–Sat, 26 working days) = ceil(15/26)=1 and round(100000/26)=4K
  var HL={rec:{d:1,w:4,m:15},pts:{d:4000,w:23000,m:100000}};
  var CERTS=["Ethics Compliance","Ethics","Life Insurance","A&S","Seg Funds"];
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  // ---------- dates (always Toronto) ----------
  function torKey(){try{var p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),o={};p.forEach(function(x){o[x.type]=x.value;});return o.year+"-"+o.month+"-"+o.day;}catch(e){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}}
  function parse(k){var a=k.split("-");return new Date(Date.UTC(+a[0],+a[1]-1,+a[2]));}
  function fmt(d){return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}
  function shift(k,n){var d=parse(k);d.setUTCDate(d.getUTCDate()+n);return fmt(d);}
  function dow(k){return parse(k).getUTCDay();}
  function weekStart(k){var w=dow(k);return shift(k,w===0?-6:1-w);}   // Monday
  function weekDays(k){var s=weekStart(k),a=[];for(var i=0;i<7;i++)a.push(shift(s,i));return a;}
  function monthDays(k){var a=[],d=k.slice(0,8)+"01";while(d.slice(0,7)===k.slice(0,7)){a.push(d);d=shift(d,1);}return a;}
  function dayDiff(a,b){return Math.round((parse(b)-parse(a))/864e5);}
  function pretty(k){var d=parse(k);return DOW[d.getUTCDay()]+", "+MON[d.getUTCMonth()]+" "+d.getUTCDate();}
  var today=torKey(), view=today;

  // ---------- targets ----------
  function phase(k){var ym=k.slice(0,7);if(ym<="2026-11")return "nov";if(ym==="2026-12")return "dec";return "full";}
  function wkT(k){return WK[phase(k)];}
  function moT(k){var ph=phase(k);if(ph==="full")return MO_FULL;var w=WK[ph],o={};for(var c in w)o[c]=Math.round(w[c]*4.33);return o;}
  function dayT(k){var w=wkT(k),o={};for(var c in w)o[c]=Math.ceil(w[c]/6);return o;}
  function sum(o){var s=0;for(var c in o)s+=o[c];return s;}

  // ---------- storage ----------
  function getJ(k,d){try{var v=JSON.parse(localStorage.getItem(PREFIX+k));return v===null||v===undefined?d:v;}catch(e){return d;}}
  function setJ(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v));}catch(e){}syncTouch(PREFIX+k);}
  function int(v){if(v===""||v===null||v===undefined)return null;var n=Math.round(+String(v).replace(/[^0-9.\-]/g,""));return isFinite(n)&&n>=0?n:null;}
  function day(k){var d=getJ("day:"+k,null);if(!d||typeof d!=="object")d={};d.m=d.m||{};d.r=d.r||{};d.h=d.h||{};return d;}
  function totals(days){var m={},r={},h={rec:0,pts:0},nc=0;CATS.forEach(function(c){m[c.id]=0;r[c.id]=0;});
    days.forEach(function(k){var d=day(k);CATS.forEach(function(c){m[c.id]+=int(d.m[c.id])||0;r[c.id]+=int(d.r[c.id])||0;});h.rec+=int(d.h.rec)||0;h.pts+=int(d.h.pts)||0;nc+=int(d.nc)||0;});
    return {m:m,r:r,h:h,nc:nc,rec:r.pr+r.br,pts:r.pc+r.bp};}   // results: recruits = pr+br results, base points = pc+bp results
  function list(name){var a=getJ(name,[]);return Array.isArray(a)?a:[];}

  // ---------- rings (same drawing as the fitness app) ----------
  function ring(pct,col,size,sw,inner){
    var r=(size-sw)/2, c=2*Math.PI*r, p=Math.max(0,Math.min(1,pct||0));
    return '<div class="ring" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#323b42" stroke-width="'+sw+'"/>'+
      (p>0?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>':'')+'</svg><div class="rin">'+inner+'</div></div>';}
  function recCol(f){return f>=1?"#16EC06":f>=0.5?"#FFDE00":f>0?"#F5A623":"#FF0026";}
  function kfmt(n,cur){n=Math.round(n||0);var x=n/1000,s=n<1000?String(n):(x<10&&Math.round(x)!==x?x.toFixed(1).replace(/\.0$/,""):String(Math.round(x)))+"K";return (cur?"$":"")+s;}
  function rbox(val,tgt,label,size,sw,k,cur){var f=tgt?val/tgt:0;
    return '<div class="rbox">'+ring(f,recCol(f),size,sw,'<b>'+(k?kfmt(val,cur):Math.round(val))+'</b>')+'<span class="rl">'+label+'</span><span class="rs">of '+(k?kfmt(tgt,cur):tgt)+(f>=1?' ✓':'')+'</span></div>';}

  // ---------- header ----------
  function renderHeader(){
    var left=Math.max(0,dayDiff(today,GOAL_DATE));$("daysLeft").textContent=left;
    $("todayLbl").textContent="Today: "+pretty(today);
    var sun=dow(today)===0;
    $("monthGoal").innerHTML='<span>Month</span><em>'+HL.rec.m+' recruits</em><em>'+kfmt(HL.pts.m)+' points</em><small style="color:#8c979f;display:block">$100K business</small>';
    $("weekGoal").innerHTML='<span>Week</span><em>'+HL.rec.w+' recruits</em><em>'+kfmt(HL.pts.w)+' points</em>';
    $("dayGoal").innerHTML='<span>Today</span>'+(sun?'<em>No goal</em><small style="color:#8c979f;display:block">Sunday (Mon–Sat)</small>':'<em>'+HL.rec.d+' recruit</em><em>'+kfmt(HL.pts.d)+' points</em>');
  }

  // ---------- tab 1: meetings ----------
  function inp(f,c,v,ph,res){return '<input class="num'+(res?' res':'')+'" type="number" inputmode="numeric" pattern="[0-9]*" min="0" step="1" data-f="'+f+'"'+(c?' data-c="'+c+'"':'')+' placeholder="'+ph+'" value="'+esc(v==null?"":v)+'">';}
  function renderRowsInputs(){
    var d=day(view),dt=dayT(view),h='<div class="mhd"><div>Meetings</div><div>#</div><div>Results</div></div>';
    CATS.forEach(function(c){h+='<div class="mrow"><div><div class="mn">'+c.n+'</div><div class="mt">goal '+dt[c.id]+'/d · '+wkT(view)[c.id]+'/wk · '+moT(view)[c.id]+'/mo</div></div>'+inp("m",c.id,d.m[c.id],"0")+inp("r",c.id,d.r[c.id],c.res,1)+'</div>';});
    h+='<div class="mrow"><div><div class="mn">New contacts</div><div class="mt">goal '+CONTACTS.d+'/d · '+CONTACTS.w+'/wk · '+CONTACTS.m+'/mo</div></div>'+inp("nc","",d.nc,"0")+'<div></div></div>';

      if(b.v>0){var y=Y(b.v);g+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+(Y(0)-y)+'" rx="1.5" fill="'+(b.t&&b.v>=b.t?'#16EC06':'#0093E7')+'"/>';
        if(i===last||n<=8){var lt=nf(b.v,m.k),tw=lt.length*6.6+8,tx=Math.max(L,Math.min(W-tw-1,cx-tw/2));g+='<rect x="'+tx+'" y="'+(y-21)+'" width="'+tw+'" height="17" rx="3" fill="#101518" fill-opacity=".85"/><text x="'+(tx+tw/2)+'" y="'+(y-8)+'" fill="#fff" font-size="11.5" font-weight="700" text-anchor="middle">'+lt+'</text>';}}
      if(b.t){var ty=Y(b.t);g+='<line x1="'+(L+slot*i+1)+'" x2="'+(L+slot*(i+1)-1)+'" y1="'+ty+'" y2="'+ty+'" stroke="#fff" stroke-width="1.4" stroke-dasharray="4 3"/>';}
      var every=n<=8?1:n<=16?2:Math.ceil(n/6);
      if(i%every===0||(n<=8)){var d=parse(b.k);g+='<text x="'+cx+'" y="'+(H-18)+'" fill="#aab4bb" font-size="11" font-weight="600" text-anchor="middle">'+(weekly||n>8?MON[d.getUTCMonth()]:DOW[d.getUTCDay()].charAt(0))+'</text><text x="'+cx+'" y="'+(H-4)+'" fill="#aab4bb" font-size="11" font-weight="600" text-anchor="middle">'+d.getUTCDate()+'</text>';}
    });
    var anyT=bars.some(function(b){return b.t;});
    if(anyT){var ly=Y(bars.filter(function(b){return b.t;})[0].t);g+='<rect x="2" y="'+(ly-10)+'" width="36" height="20" rx="4" fill="#fff"/><text x="20" y="'+(ly+4)+'" fill="#101518" font-size="11" font-weight="800" text-anchor="middle">GOAL</text>';}
    return g+'</svg>';
  }
  function fmtR(days){var a=parse(days[0]),b=parse(days[days.length-1]);return (MON[a.getUTCMonth()]+" "+a.getUTCDate()+" - "+MON[b.getUTCMonth()]+" "+b.getUTCDate()).toUpperCase();}
  function renderTV(){
    var m=mBy(tvSlug);if(!m){show("trends");return;}
    var o="";METRICS.forEach(function(x){o+='<option value="'+x.s+'">'+x.n+'</option>';});if($("tvSel").innerHTML!==o)$("tvSel").innerHTML=o;
    $("tvSel").value=m.s;$("tvSelName").textContent=m.n;$("tvSelIc").textContent=m.i;
    [].forEach.call(document.querySelectorAll("#tvSeg button"),function(b){b.classList.toggle("on",b.dataset.r===tvRange);});
    var w=tvWin(),tot=sumV(m,w.days),bars,tgt=null,weekly=false,pill="",ins;
    if(!w.all){bars=w.days.map(function(k){return {k:k,v:m.v(k),t:m.T&&m.T.d?(dow(k)===0?0:m.T.d(k)):null};});
      tgt=tgtFor(m,tvRange,w.days[0]);
      var pdays=tvRange==="W"?weekDays(w.prev):monthDays(w.prev),pt=sumV(m,pdays);
      if(pt||tot){var d=tot-pt;pill='<span class="tvpill '+(d>0?'g':d<0?'b':'')+'">'+(d===0?'● same as':(d>0?'▲ ':'▼ ')+nf(Math.abs(d),m.k)+(d>0?' more than':' less than'))+' prior '+(tvRange==="W"?'week':'month')+'</span>';}
    }else{weekly=true;var wk={};w.days.forEach(function(k){var s=weekStart(k);wk[s]=(wk[s]||0)+m.v(k);});
      bars=Object.keys(wk).sort().map(function(s){return {k:s,v:wk[s],t:m.T&&m.T.w?m.T.w(s):null};});
      if(m.T&&m.T.w)tgt=bars.reduce(function(a,b){return a+(b.t||0);},0);}
    $("tvLbl").textContent=w.all?"TOTAL · ALL TIME":tvRange==="W"?"TOTAL · WEEK":"TOTAL · MONTH";
    $("tvTot").innerHTML=nf(tot,m.k)+(tgt!=null?'<small>of '+nf(tgt,m.k)+'</small>':'');
    $("tvPill").innerHTML=pill;
    $("tvRange").textContent=w.all?fmtR(w.days):fmtR(w.days);
    $("tvPrev").disabled=w.all||w.days[0]<=firstDate();$("tvNext").disabled=w.all||tvOff===0;
    var per=w.all?"so far":tvRange==="W"?"this week":"this month";
    if(tgt!=null){var gap=tgt-tot;ins=gap<=0?"Goal hit "+per+": "+nf(tot,m.k)+" of "+nf(tgt,m.k)+" 👍":nf(tot,m.k)+" of "+nf(tgt,m.k)+" "+per+" ("+Math.round(tot/tgt*100)+"%). "+nf(gap,m.k)+" to go.";}
    else ins=nf(tot,m.k)+" "+per+". No target set for this one.";
    if(w.all&&bars.length)ins+=" Weekly average "+nf(Math.round(tot/bars.length),m.k)+(m.T&&m.T.w?" vs goal "+nf(m.T.w(today),m.k):"")+".";
    $("tvIns").textContent=ins;
    $("tvChart").innerHTML=tvChart(m,bars,weekly);
    $("tvFoot").textContent=(weekly?"One bar per week (Mon–Sun). ":"One bar per day. ")+"Green bar = goal hit. Dashed line = "+(weekly?"weekly":"daily")+" goal."+(m.s==="certs"||m.s==="lic"?" Filled in by your bot.":"")+(!weekly&&m.T&&!m.T.d?" No daily goal for this one; see the total above.":"");
  }
  $("tvBack").addEventListener("click",function(){if(tvPushed){history.back();}else{try{history.replaceState(null,"","#trends");}catch(e){}show("trends");}});
  $("tvSel").addEventListener("change",function(){tvOff=0;tvSlug=this.value;try{history.replaceState(null,"","#trends/"+this.value);}catch(e){}renderTV();});
  $("tvSeg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;tvRange=b.dataset.r;tvOff=0;renderTV();});
  $("tvPrev").addEventListener("click",function(){tvOff++;renderTV();});
  $("tvNext").addEventListener("click",function(){if(tvOff>0)tvOff--;renderTV();});

  // ---------- tabs ----------
  var tab="meet",TABS={meet:renderMeet,cert:renderCert,lic:renderLic,md:renderMd,trends:renderDash,tview:renderTV};
  function show(t){t=t||"";if(t.indexOf("trends/")===0){tvSlug=t.slice(7);t="tview";}else if(t==="tview")t=tvSlug?"tview":"trends";if(!TABS[t])t="meet";tab=t;[].forEach.call(document.querySelectorAll(".page"),function(p){p.classList.toggle("on",p.id==="p-"+t);});
    var hb=t==="tview"?"trends":t;[].forEach.call(document.querySelectorAll("#tabs button"),function(b){b.classList.toggle("on",b.dataset.t===hb);});$("hdr").hidden=t==="tview";renderHeader();TABS[t]();}
  $("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;try{history.replaceState(null,"","#"+b.dataset.t);}catch(x){}tvPushed=false;show(b.dataset.t);window.scrollTo(0,0);});
  window.addEventListener("hashchange",function(){show(location.hash.slice(1));window.scrollTo(0,0);});
  function checkDay(){var t=torKey();if(t!==today){var o=today;today=t;if(view===o)view=t;if(dv.c===o)dv.c=t;if(dv.l===o)dv.l=t;show(tab);}}
  document.addEventListener("visibilitychange",function(){if(!document.hidden)checkDay();});
  window.addEventListener("focus",checkDay);setInterval(checkDay,60000);

  // ================= CLOUD SYNC (npoint.io JSON bin, always on, offline-first; same design as the fitness app) =================
  // Bin format: {"_rev":n, "bs-v1:KEY":{"v":"<JSON string>","t":editTimeMs} | {"t":ms,"d":1} (deleted)}. localStorage stays the working copy.
  // No compare-and-swap on npoint, so each write is: read -> merge -> write -> wait 1.5 s -> re-read; if someone else wrote meanwhile, merge again (max 4 rounds).
  // Device bookkeeping (never synced): bs-sync:sh (hash of last synced value per key), bs-sync:mt (local edit time per key), bs-sync:rev, bs-sync:at.
  var SY={busy:false,again:false,timer:null,err:"",stale:0};
  function syGet(k,d){try{var v=JSON.parse(localStorage.getItem("bs-sync:"+k));return v===null||v===undefined?d:v;}catch(e){return d;}}
  function sySet(k,v){try{if(v===null)localStorage.removeItem("bs-sync:"+k);else localStorage.setItem("bs-sync:"+k,JSON.stringify(v));}catch(e){}}
  function syHash(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36)+"."+str.length;}
  function syOn(){return !!(SYNC_CONFIG&&SYNC_CONFIG.url&&window.fetch);}
  function syncTouch(fk){if(!syOn())return;var mt=syGet("mt",{});mt[fk]=Date.now();sySet("mt",mt);clearTimeout(SY.timer);SY.timer=setTimeout(updThenSync,2000);}
  function syParse(x){try{return JSON.parse(x);}catch(e){return null;}}
  function canon(o){if(Array.isArray(o))return "["+o.map(canon).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).sort().map(function(k){return JSON.stringify(k)+":"+canon(o[k]);}).join(",")+"}";return JSON.stringify(o);}
  function syHttp(opt){var ctl=window.AbortController?new AbortController():null,to=setTimeout(function(){if(ctl)ctl.abort();},15000);
    return fetch(SYNC_CONFIG.url+(opt?"":"?_="+Date.now()),{method:opt?"POST":"GET",headers:opt?{"Content-Type":"application/json"}:{},body:opt?opt.body:undefined,cache:"no-store",signal:ctl?ctl.signal:undefined})
      .then(function(r){clearTimeout(to);return r.text().then(function(t){if(!r.ok){var er=new Error("HTTP "+r.status);er.status=r.status;throw er;}return syParse(t);});},function(e){clearTimeout(to);throw e;});}
  function syRead(){return syHttp().then(function(d){return (d&&typeof d==="object"&&!Array.isArray(d))?d:{};});}
  function syWait(ms){return new Promise(function(r){setTimeout(r,ms);});}
  function syLocalKeys(){var a=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf(PREFIX)===0)a.push(k);}return a;}
  // merge one key when BOTH sides changed: day records merge field by field (newer side wins per field); lists merge by id; else newer wins
  function syMerge(fk,a,b,ta,tb){
    var newS=ta>=tb?a:b,oldS=ta>=tb?b:a;if(a===null||b===null)return newS;
    var N=syParse(newS),O=syParse(oldS),k=fk.slice(PREFIX.length);if(N===null||O===null)return newS;
    if(/^day:/.test(k)&&typeof N==="object"&&typeof O==="object"){var r={m:{},r:{}},z;
      for(z in (O.m||{}))r.m[z]=O.m[z];for(z in (N.m||{}))r.m[z]=N.m[z];for(z in (O.r||{}))r.r[z]=O.r[z];for(z in (N.r||{}))r.r[z]=N.r[z];
      r.h={};for(z in (O.h||{}))r.h[z]=O.h[z];for(z in (N.h||{}))r.h[z]=N.h[z];if(N.nc!==undefined)r.nc=N.nc;else if(O.nc!==undefined)r.nc=O.nc;r.u=Math.max(+N.u||0,+O.u||0);return JSON.stringify(r);}
    if(Array.isArray(N)&&Array.isArray(O)){var m={},out=[];O.forEach(function(x){if(x&&x.id!==undefined)m[x.id]=x;});
      N.forEach(function(x){if(x&&x.id!==undefined&&(!m[x.id]||(+x.u||0)>=(+m[x.id].u||0)))m[x.id]=x;});
      N.concat(O).forEach(function(x){if(x&&x.id!==undefined&&m[x.id]){out.push(m[x.id]);delete m[x.id];}});return JSON.stringify(out);}
    return newS;}
  function syncNow(){
    if(!syOn())return Promise.resolve();
    if(SY.busy){SY.again=true;return Promise.resolve();}
    SY.busy=true;var changed=false;
    function round(n,D){
      var sh=syGet("sh",{}),mt=syGet("mt",{}),now=Date.now();
      if((+D._rev||0)<syGet("rev",0)&&SY.stale<3){SY.stale++;var se=new Error("stale");se.stale=true;throw se;}
      SY.stale=0;
      Object.keys(D).forEach(function(k){if(k.indexOf(PREFIX)!==0)return;var r=D[k]||{};
        var loc=localStorage.getItem(k),rv=r.d?null:(typeof r.v==="string"?r.v:null),dirty=loc===null?sh[k]!==undefined:syHash(loc)!==sh[k];
        if(loc===rv){if(rv===null)delete sh[k];else sh[k]=syHash(rv);return;}
        var remoteSame=rv!==null&&sh[k]===syHash(rv);
        var nv=dirty?(remoteSame?loc:syMerge(k,loc,rv,mt[k]||(sh[k]!==undefined?now:0),+r.t||0)):rv;
        if(nv!==loc){try{if(nv===null)localStorage.removeItem(k);else localStorage.setItem(k,nv);changed=true;}catch(e){return;}}
        if(rv===null)delete sh[k];else sh[k]=syHash(rv);
        if(nv!==rv)mt[k]=Math.max(now,(+r.t||0)+1);else delete mt[k];});
      sySet("sh",sh);sySet("mt",mt);
      var N={},diff=false,sent={};
      Object.keys(D).forEach(function(k){if(k.indexOf(PREFIX)===0&&!(D[k]&&D[k].d&&now-(+D[k].t||0)>180*864e5))N[k]=D[k];});
      syLocalKeys().forEach(function(k){var v=localStorage.getItem(k);sent[k]=v;if(!D[k]||D[k].d||D[k].v!==v){N[k]={v:v,t:mt[k]||now};diff=true;}});
      Object.keys(D).forEach(function(k){if(k.indexOf(PREFIX)===0&&D[k]&&!D[k].d&&localStorage.getItem(k)===null){N[k]={t:now,d:1};diff=true;}});
      function done(){var sh2={};Object.keys(sent).forEach(function(k){sh2[k]=syHash(sent[k]);});var mt2=syGet("mt",{});
        Object.keys(mt2).forEach(function(k){if(localStorage.getItem(k)===sent[k])delete mt2[k];});sySet("sh",sh2);sySet("mt",mt2);}
      if(!diff){done();return;}
      N._rev=(+D._rev||0)+1;var body=JSON.stringify(N);
      return syHttp({body:body}).then(function(){sySet("rev",N._rev);return syWait(1500);}).then(syRead).then(function(D2){
        if(canon(D2)===canon(N)||n>=4){done();return;}
        return round(n+1,D2);});
    }
    return syRead().then(function(D){return round(1,D);}).then(function(){SY.err="";sySet("at",new Date().toISOString());},function(e){
        if(e&&e.stale){setTimeout(syncNow,4000);return;}SY.err="offline";})
      .then(function(){SY.busy=false;syUI();if(changed)syRerender();if(SY.again){SY.again=false;return syncNow();}});
  }
  function syRerender(){var ae=document.activeElement;if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT"))return;show(tab);}
  function ago(iso){var s=Math.round((Date.now()-new Date(iso))/1000);return s<60?"just now":s<3600?Math.round(s/60)+" min ago":Math.round(s/3600)+" h ago";}
  function syUI(){var at=syGet("at",null);$("appVer").textContent="App v"+APP_VERSION+(SY.err?" · ☁️ offline, saved on this device":at?" · ☁️ synced "+ago(at):" · ☁️ syncing…");}
  $("syNow").addEventListener("click",function(){$("appVer").textContent="Syncing…";syncNow();});

  // ---- self-update: version.json vs APP_VERSION; reload once per new version (sessionStorage guard). Never touches localStorage. ----
  function checkUpdate(){
    try{return fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).then(function(j){
      if(!j||typeof j.v!=="string"||!j.v||j.v===APP_VERSION)return false;
      var g="bs-upd:"+j.v;try{if(sessionStorage.getItem(g))return false;sessionStorage.setItem(g,"1");}catch(e){return false;}
      location.replace(location.pathname+"?v="+encodeURIComponent(j.v)+location.hash);return true;
    }).catch(function(){return false;});}catch(e){return Promise.resolve(false);}
  }
  function updThenSync(){return checkUpdate().then(function(re){if(!re)return syncNow();});}
  document.addEventListener("visibilitychange",function(){if(!document.hidden)updThenSync();});
  try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations)navigator.serviceWorker.getRegistrations().then(function(rs){var base=location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
    rs.forEach(function(r){if(r.scope&&base.indexOf(r.scope)===0&&/baseshop-builder/.test(r.scope))r.unregister();});}).catch(function(){});}catch(e){}

  show(location.hash.slice(1));
  syUI();
  if(syOn()){updThenSync();window.addEventListener("online",updThenSync);setInterval(function(){if(!document.hidden)updThenSync();},60000);}
  else checkUpdate();
  window.__bs={show:show,totals:totals,dayT:dayT,wkT:wkT,moT:moT};
})();
